<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Birthday Wishes</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg: #ffffff;
            --text: #1d1d1f;
            --accent: #007aff;
            --gray: #f5f5f7;
            --error: #ff3b30;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100dvh;
            overflow: hidden;
        }

        .screen {
            position: absolute;
            width: 100%;
            max-width: 400px;
            padding: 30px;
            text-align: center;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .hidden { display: none; opacity: 0; transform: translateY(20px); }

        .profile-container {
            width: 150px;
            height: 150px;
            margin: 0 auto 25px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid var(--gray);
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .profile-container img { width: 100%; height: 100%; object-fit: cover; }

        h1 { font-size: 26px; font-weight: 600; margin-bottom: 12px; }
        p { font-size: 15px; color: #86868b; margin-bottom: 30px; }

        .btn {
            background: var(--text);
            color: #fff;
            border: none;
            padding: 18px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
        }

        .date-field {
            width: 100%;
            background: var(--gray);
            border: 2px solid transparent;
            border-radius: 14px;
            padding: 18px;
            font-size: 22px;
            font-weight: 600;
            text-align: center;
            outline: none;
            margin-bottom: 10px;
        }
        .date-field:focus { border-color: var(--accent); background: #fff; }

        #errorMsg {
            color: var(--error);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 15px;
            height: 18px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .scratch-wrap {
            position: relative;
            width: 100%;
            height: 100px;
            background: var(--gray);
            border-radius: 20px;
            overflow: hidden;
        }
        .gift-reveal {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: var(--accent);
            font-size: 18px;
        }
        canvas { position: absolute; top: 0; left: 0; touch-action: none; transition: opacity 0.5s; z-index: 10; }
    </style>
</head>
<body>

    <div id="s1" class="screen">
        <h1>Welcome.</h1>
        <p>Bday wishes for Anush 17/04/2026</p>
        <button class="btn" onclick="showScreen(1, 2)">Enter</button>
    </div>

    <div id="s2" class="screen hidden">
        <div class="profile-container">
            <img src="IMG-20260112-WA0010.jpg" alt="Bro">
        </div>
        <h1>Happy Birthday Bro!</h1>
        <p>System sync complete. You’ve leveled up. <br> Time to claim your reward.</p>
        <button class="btn" onclick="showScreen(2, 3)">Unlock Gift</button>
    </div>

    <div id="s3" class="screen hidden">
        <h1>Identity Check</h1>
        <p>Enter My birth date to verify.</p>
        <input type="text" id="dateField" class="date-field" placeholder="DD / MM / YYYY" inputmode="numeric" maxlength="14">
        <div id="errorMsg">Incorrect date, try again.</div>
        <button class="btn" onclick="verifyDate()">Verify Access</button>
    </div>

    <div id="s4" class="screen hidden">
        <h1>Unlocked!</h1>
        <p>Scrub the card to reveal your surprise.</p>
        <div class="scratch-wrap">
            <div class="gift-reveal">Mystery GIFT UNLOCKED!</div>
            <canvas id="scratch-canvas"></canvas>
        </div>
    </div>

    <audio id="audioWish" src="deg-deg_4M6Cojn.mp3"></audio>
    <audio id="audioReveal" src="y2mate_xvijLIk.mp3"></audio>
    <audio id="audioError" src="Fahh_-_Sound_Effect___SowaSFX(256k).mp3"></audio>

    <script>
        const dateInput = document.getElementById('dateField');
        const errorMsg = document.getElementById('errorMsg');

        dateInput.addEventListener('input', function(e) {
            errorMsg.style.opacity = "0";
            let val = this.value.replace(/\D/g, ''); 
            let result = '';

            if (val.length > 0) {
                result = val.substring(0, 2);
                if (val.length >= 2) result += ' / ';
                if (val.length > 2) {
                    result += val.substring(2, 4);
                    if (val.length >= 4) result += ' / ';
                }
                if (val.length > 4) {
                    result += val.substring(4, 8);
                }
            }
            this.value = result;
        });

        function fireConfetti() {
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 },
                zIndex: 9999,
                colors: ['#007aff', '#5856d6', '#ff2d55']
            });
        }

        function showScreen(from, to) {
            document.getElementById(`s${from}`).classList.add('hidden');
            const next = document.getElementById(`s${to}`);
            next.classList.remove('hidden');

            if (to === 2) {
                document.getElementById('audioWish').play().catch(() => {});
                fireConfetti();
            }
            if (to === 4) initScratch();
        }

        function verifyDate() {
            if (dateInput.value === "20 / 01 / 2007") {
                showScreen(3, 4);
            } else {
                errorMsg.style.opacity = "1";
                document.getElementById('audioError').play().catch(() => {});
            }
        }

        function initScratch() {
            const canvas = document.getElementById('scratch-canvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            const wrap = canvas.parentElement;
            let revealed = false;

            canvas.width = wrap.offsetWidth;
            canvas.height = wrap.offsetHeight;

            ctx.fillStyle = '#d1d1d6';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#8e8e93';
            ctx.font = '600 14px Inter';
            ctx.textAlign = 'center';
            ctx.fillText('SCRUB TO REVEAL', canvas.width/2, canvas.height/2 + 5);

            const checkProgress = () => {
                if (revealed) return;
                const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
                let trans = 0;
                for (let i = 3; i < pixels.length; i += 4) { if (pixels[i] === 0) trans++; }
                if ((trans / (pixels.length / 4)) > 0.70) {
                    revealed = true;
                    canvas.style.opacity = '0';
                    setTimeout(() => canvas.remove(), 500);
                    document.getElementById('audioReveal').play().catch(() => {});
                    fireConfetti();
                    setTimeout(fireConfetti, 400); 
                }
            };

            const scratch = (e) => {
                const rect = canvas.getBoundingClientRect();
                const x = (e.clientX || e.touches[0].clientX) - rect.left;
                const y = (e.clientY || e.touches[0].clientY) - rect.top;
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(x, y, 30, 0, Math.PI * 2);
                ctx.fill();
                if (Math.random() > 0.9) checkProgress();
            };

            let active = false;
            canvas.addEventListener('mousedown', () => active = true);
            canvas.addEventListener('touchstart', (e) => { active = true; scratch(e); });
            window.addEventListener('mouseup', () => { active = false; checkProgress(); });
            window.addEventListener('touchend', () => { active = false; checkProgress(); });
            canvas.addEventListener('mousemove', (e) => active && scratch(e));
            canvas.addEventListener('touchmove', (e) => { e.preventDefault(); active && scratch(e); });
        }
    </script>
</body>
</html>
